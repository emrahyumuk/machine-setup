# --- video ---
# Deinterlace always. Some live HLS streams are interlaced-source material
# encoded as progressive (fields woven into frames, no interlaced flag) and
# comb in every player that doesn't deinterlace; clean progressive sources
# are not harmed by bwdif in practice. Toggle live with `d`.
deinterlace=yes
# VA-API decode with frames copied back to RAM, so the software bwdif
# deinterlacer ALWAYS applies — with pure hwdec (auto-safe) the GPU-side
# deinterlacer skips frames that aren't flagged interlaced (measured 2026-08-21).
hwdec=vaapi-copy
# Wayland-native GPU output, proper vsync
vo=gpu-next
gpu-context=wayland
# Keep the iGPU load light for 1080p content
profile=fast
video-sync=display-resample
# --- window ---
keep-open=yes
save-position-on-quit=no
autofit-larger=90%x90%
# --- network / streams ---
cache=yes
demuxer-max-bytes=150MiB
demuxer-readahead-secs=20
hls-bitrate=max
# --- osd ---
osd-bar=yes
osd-duration=1500
