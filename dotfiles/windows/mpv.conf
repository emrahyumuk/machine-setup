# Windows variant of dotfiles/mpv.conf -> %APPDATA%\mpv\mpv.conf
# --- video ---
# Deinterlace always (same reason as the Fedora config: interlaced live HLS
# encoded as progressive combs without it). Toggle live with `d`.
deinterlace=yes
# D3D11 decode with frames copied back to RAM, so the software bwdif
# deinterlacer sees every frame — the vaapi-copy reasoning, Windows API.
hwdec=d3d11va-copy
vo=gpu-next
gpu-api=d3d11
# Keep the iGPU load light for 1080p content
profile=fast
video-sync=display-resample
# --- window ---
keep-open=yes
save-position-on-quit=no
autofit-larger=90%x90%
# --- network / streams ---
cache=yes
demuxer-max-bytes=150MiB
demuxer-readahead-secs=20
hls-bitrate=max
# --- osd ---
osd-bar=yes
osd-duration=1500
